name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      # the ML stack (torch, demucs, whisperx; several GB) isn't needed by the tests
      - run: uv sync --frozen --no-group ml
      - run: uv run --no-sync pytest -q
      - name: Check the installer scripts parse
        if: runner.os == 'Linux'
        run: bash -n scripts/install.sh && python3 -m py_compile scripts/tv_setup.py
      - name: Check the installer scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  linux-roundtrip:
    name: Linux install + uninstall round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install into a fresh folder (no ML stack, no service; ufw rules via passwordless sudo)
        run: |
          mkdir -p "$RUNNER_TEMP/kp" && cp -r . "$RUNNER_TEMP/kp" && rm -rf "$RUNNER_TEMP/kp/.git"
          cd "$RUNNER_TEMP/kp"
          printf 'DATA_DIR=%s\n' "$RUNNER_TEMP/kp-data" >> .env.example
          scripts/install.sh --no-service --no-ml --yes
          # what a server run would create in the data dir
          mkdir -p "$RUNNER_TEMP/kp-data/logs" && echo x > "$RUNNER_TEMP/kp-data/karaoke.db"
          cat data/install-manifest.json
          sudo ufw show added
      - name: Uninstall and check nothing is left
        run: |
          cd "$RUNNER_TEMP/kp"
          ours() { python3 -c "import json,sys; d=json.load(open('data/install-manifest.json')); print(next((t['path'] for t in d['pc']['tools'] if t['name']==sys.argv[1] and t['installed_by_us']), ''))" "$1"; }
          uv="$(ours uv)"; py="$(ours python)"
          echo "installed by us: uv=${uv:-no} python=${py:-no}"
          scripts/uninstall.sh --yes
          fail=0
          for p in .venv data "$RUNNER_TEMP/kp-data" $uv $py; do [ -e "$p" ] && { echo "left behind: $p"; fail=1; }; done
          sudo ufw show added | grep -q 'Karaoke Party' && { echo "left behind: ufw rules"; fail=1; }
          pgrep -f "$RUNNER_TEMP/kp/.venv" && { echo "left behind: processes"; fail=1; }
          exit $fail

  tvapp:
    name: TV app build, unit tests, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tvapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tvapp-debug
          path: |
            tvapp/app/build/outputs/apk/debug/app-debug.apk
            tvapp/app/build/reports/
          retention-days: 14

  emulator:
    name: TV app on Android TV emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30, 34]
    steps:
      # first, before setup-java puts the JDK into the tool cache (which stays)
      - name: Free disk space (the API 34 TV image alone wants a 7 GB data partition)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the app and test APKs
        working-directory: tvapp
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, grant like a user would (scripts/tv_setup.py), run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 scripts/tv_setup.py --serial emulator-5554 --apk tvapp/app/build/outputs/apk/debug/app-debug.apk --grant-only
            cd tvapp && ./gradlew connectedDebugAndroidTest
            adb -s emulator-5554 exec-out screencap -p > tvapp/app/build/emulator-api${{ matrix.api }}.png || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            tvapp/app/build/reports/androidTests/
            tvapp/app/build/outputs/androidTest-results/
            tvapp/app/build/emulator-api${{ matrix.api }}.png
          retention-days: 14
